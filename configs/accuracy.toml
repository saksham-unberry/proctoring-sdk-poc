[paths]
image_dir = "images"
output_dir = "outputs/accuracy_run"
face_detector_model = "models/face_detector.tflite"
face_landmarker_model = "models/face_landmarker.task"

[object_detection]
family = "yolo"
models = ["models/yolo12x.pt", "models/yolo11l.pt"]
image_size = 960
global_confidence = 0.10
fusion_iou = 0.55
primary_model = "ensemble"
# Phones partly cut off at frame edges are easy to miss in full-frame inference.
# Run a phone-only recall pass on edge crops and map detections back to the frame.
edge_crop_enabled = true
edge_crop_ratio = 0.35
edge_crop_min_confidence = 0.12
edge_crop_labels = ["cell_phone"]

[object_detection.class_thresholds]
person = 0.35
cell_phone = 0.18
book = 0.30
laptop = 0.40
monitor = 0.40
keyboard = 0.35
mouse = 0.35

[face_detection]
confidence = 0.45
landmarker_faces = 3

[quality]
blur_threshold = 55.0
low_light_threshold = 50.0
overexposed_threshold = 220.0
blocked_brightness = 20.0
blocked_std = 10.0

[extra_person]
proximity_high = 0.22
proximity_medium = 0.40
size_ratio_high = 0.55
size_ratio_medium = 0.30
ignore_size_ratio = 0.10

[engagement]
yaw_toward_degrees = 20.0
gaze_toward = 0.25

[object_filters]
# COCO phone false positives often appear on mouth/eyeglass detail in close faces.
# Keep face-centered phone boxes only when the detector confidence is stronger.
face_phone_min_confidence = 0.75

[temporal]
fps = 1.0
window_seconds = 10.0
presence_medium_ratio = 0.30
close_medium_ratio = 0.20
presence_high_ratio = 0.50
close_high_ratio = 0.30
close_distance = 0.25
head_pose_ratio = 0.20
audio_ratio = 0.20
other_flag_ratio = 0.15

[gpt_review]
# Send only locally suspicious frames to expensive multimodal review.
enabled = true
min_risk_level = "MEDIUM"
min_score = 80
max_frames = 12
max_per_signal = 10
min_gap_frames = 20
